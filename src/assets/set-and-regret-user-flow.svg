<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <rect width="1200" height="760" fill="#fff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
  </defs>

  <g fill="none" stroke="#111" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
    <rect x="500" y="40" width="156" height="124" rx="10"/>
    <rect x="690" y="40" width="156" height="124" rx="10"/>
    <rect x="880" y="40" width="156" height="124" rx="10"/>

    <rect x="40" y="280" width="156" height="124" rx="10"/>
    <rect x="250" y="280" width="156" height="124" rx="10"/>
    <rect x="460" y="280" width="156" height="124" rx="10"/>
    <rect x="690" y="280" width="156" height="124" rx="10"/>

    <rect x="250" y="540" width="156" height="124" rx="10"/>
    <rect x="460" y="540" width="156" height="124" rx="10"/>
    <rect x="690" y="540" width="156" height="124" rx="10"/>

    <!-- splash chain -->
    <path d="M 196 342 H 240" marker-end="url(#arrow)"/>
    <path d="M 406 342 H 450" marker-end="url(#arrow)"/>
    <path d="M 616 342 H 680" marker-end="url(#arrow)"/>

    <!-- alarm forks up to three -->
    <path d="M 768 280 V 224"/>
    <path d="M 578 224 H 958"/>
    <path d="M 578 224 V 174" marker-end="url(#arrow)"/>
    <path d="M 768 224 V 174" marker-end="url(#arrow)"/>
    <path d="M 958 224 V 174" marker-end="url(#arrow)"/>

    <!-- home down to timer + AA, AA to start over -->
    <path d="M 538 404 V 452"/>
    <path d="M 328 452 H 538"/>
    <path d="M 328 452 V 530" marker-end="url(#arrow)"/>
    <path d="M 538 452 V 530" marker-end="url(#arrow)"/>
    <path d="M 616 602 H 680" marker-end="url(#arrow)"/>
  </g>

  <g fill="#111" font-family="Courier New, Courier, monospace" font-size="17" text-anchor="middle">
    <text x="578" y="96">Set an</text>
    <text x="578" y="118">alarm</text>

    <text x="768" y="96">Edit</text>
    <text x="768" y="118">alarms</text>

    <text x="958" y="96">Sleeping</text>
    <text x="958" y="118">habits</text>

    <text x="118" y="340">iPhone</text>
    <text x="118" y="362">Home</text>

    <text x="328" y="350">Splash</text>

    <text x="538" y="350">Home Page</text>

    <text x="768" y="350">Alarm</text>

    <text x="328" y="610">Timer</text>

    <text x="538" y="610">AA chip</text>

    <text x="768" y="598">Start</text>
    <text x="768" y="620">over</text>
  </g>
</svg>
